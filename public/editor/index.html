<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Färdväg</title>
    <script>
      (() => {
        const current = new URL(window.location.href);
        const appRootPath = current.pathname.replace(
          /\/editor(?:\/index\.html)?\/?$/,
          "/",
        );
        const target = new URL(appRootPath, current.origin);
        target.searchParams.set("mode", "editor");
        window.location.replace(target.toString());
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=../?mode=editor" />
    </noscript>
  </head>
  <body></body>
</html>
